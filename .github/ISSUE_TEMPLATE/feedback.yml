name: Feedback or feature request
description: Suggest something Quant SharpeScope should add, or report a problem
title: "[Feedback] "
labels: ["feedback"]
body:
  - type: dropdown
    id: type
    attributes:
      label: Type
      options: ["Feature request", "Bug report", "Question", "Other"]
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Details
      description: What would you like to see, and how would you use it?
    validations:
      required: true
  - type: dropdown
    id: user
    attributes:
      label: How do you use QSS?
      options: ["Student / learning", "Personal investing", "Professional / quant", "Teaching", "Other"]
